<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>CorpID 首頁 (已登入)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e0e0e0;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 20px 0;
    font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  .phone-frame {
    width: 393px; height: 852px;
    background: #edf2f8;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    border-radius: 48px;
  }

  /* ---- Hero photo (status bar, logo, pills, QR & search bar embedded) ---- */
  .hero {
    position: relative; flex-shrink: 0; height: 305px;
    background: #123a75 url('../images/corpid_logined_header.jpg') no-repeat top center;
    background-size: 100% auto;
  }
  .hero-greet {
    position: absolute; left: 16px; top: 112px; z-index: 2; color: #fff;
    text-shadow: 0 3px 14px rgba(0,15,45,.8), 0 1px 4px rgba(0,15,45,.55);
  }
  .g-row { display: flex; align-items: center; }
  .g-1 { font-size: 20px; font-weight: 700; gap: 14px; margin-bottom: 14px; }
  .g-2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .g-3 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }

  /* ---- Content card ---- */
  .body-scroll {
    flex: 1; overflow-y: auto;
    background: #edf2f8;
    border-radius: 22px 22px 0 0;
    margin-top: -12px; position: relative; z-index: 2;
    scrollbar-width: none;        /* Firefox */
    -ms-overflow-style: none;     /* IE / legacy Edge */
  }
  .body-scroll::-webkit-scrollbar { display: none; }  /* Chrome / Safari / Edge */

  /* Announcement */
  .ann {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border-radius: 14px; padding: 16px 16px;
    margin: 14px 14px 0;
    box-shadow: 0 2px 8px rgba(20,60,120,.06);
  }
  .ann-ic { flex-shrink: 0; display: flex; }
  .ann-body { flex: 1; min-width: 0; }
  .ann-title {
    font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ann-date { font-size: 12.5px; color: #9aa0a6; }
  .dots { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px 0 2px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: #c9d2dc; }
  .dot.active { width: 16px; background: #1b6fc9; }

  /* Quick actions */
  .quick-row {
    display: flex; padding: 12px 8px 4px;
  }
  .qa {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;
    cursor: pointer;
  }
  .qa .ic { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .qa .lbl { font-size: 12px; color: #2a2a2a; }

  /* Guide tabs */
  .guide-head {
    display: flex; align-items: baseline; padding: 12px 16px 0; gap: 22px;
  }
  .guide-tab {
    padding: 6px 0 10px; font-size: 17px; color: #9aa0a6; cursor: pointer;
    background: none; border: none; font-family: inherit; position: relative; font-weight: 600;
  }
  .guide-tab.active { color: #1a1a1a; font-weight: 700; }
  .guide-tab.active::after {
    content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 3px;
    background: #1155BB; border-radius: 2px;
  }
  .guide-more { margin-left: auto; color: #1155BB; font-size: 14px; cursor: pointer; }

  /* Cards */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .cards {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 14px;
  }
  .card {
    border-radius: 16px; padding: 16px 14px; position: relative; overflow: hidden;
    min-height: 92px; display: flex; flex-direction: column;
  }
  .card.tall { grid-row: span 2; justify-content: flex-start; }
  .card .c-title { font-size: 16px; font-weight: 700; color: #2a2a2a; line-height: 1.35; position: relative; z-index: 1; }
  .card .c-sub { font-size: 12px; color: #7c8590; margin-top: 4px; position: relative; z-index: 1; }
  .card .c-ic {
    position: absolute; right: 12px; bottom: 10px; z-index: 1; opacity: .85;
  }
  .bg-mint   { background: #e2f1ec; }
  .bg-yellow { background: #fbf3d5; }
  .bg-pink   { background: #f6e3ec; }
  .bg-peri   { background: #e6e9f5; }
  .bg-blue   { background: #e2eaf6; }

  /* ---- Bottom Nav ---- */
  .bottom-nav {
    height: 78px; background: #fff; border-top: 1px solid #e7e9ec;
    display: flex; align-items: flex-start; flex-shrink: 0; padding-top: 8px;
    position: relative; z-index: 3;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; color: #5b6168;
  }
  .nav-item.active { color: #1155BB; }
  .nav-item svg { display: block; }
  .nav-label { font-size: 11px; font-weight: 500; color: inherit; }
</style>
</head>
<body>
<div class="phone-frame">

  <!-- Hero photo (status bar, logo, pills, QR icon & search bar are part of the image) -->
  <div class="hero">
    <div class="hero-greet">
      <div class="g-row g-1">陳大文
        <svg width="24" height="17" viewBox="0 0 22 16" fill="none" style="margin-left:14px"><path d="M1 8 a11 7 0 0 1 20 0 a11 7 0 0 1 -20 0 Z" stroke="#fff" stroke-width="1.8"/><circle cx="11" cy="8" r="3" stroke="#fff" stroke-width="1.8"/></svg>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="#fff" style="margin-left:16px"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="11" y="1" width="6" height="6" rx="1"/><rect x="1" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="2.6" height="2.6"/><rect x="15.4" y="11" width="2.6" height="2.6"/><rect x="11" y="15.4" width="2.6" height="2.6"/><rect x="15.4" y="15.4" width="2.6" height="2.6"/></svg>
      </div>
      <div class="g-row g-2">仁一有限公司</div>

  <!-- Content -->
  <div class="body-scroll">

      <div class="ann-ic">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
          <path d="M6 13 v8 a2 2 0 0 0 2 2 h3 l9 6 V5 l-9 6 H8 a2 2 0 0 0 -2 2 Z" fill="#2fb9c9"/>
          <path d="M11 23 l2.5 7 a1.6 1.6 0 0 0 3 -1 l-1.8 -5.4" fill="#1b6fc9"/>
          <path d="M24 11 a7 7 0 0 1 0 12" stroke="#1b6fc9" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M27.5 8.5 a11 11 0 0 1 0 17" stroke="#2fb9c9" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="ann-body">
        <div class="ann-title">一站式電子申請平台現已支援 CorpID 登…</div>

    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>

    <!-- Quick actions -->
    <div class="quick-row">
      <div class="qa">
        <div class="ic">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <rect x="7" y="14" width="13" height="22" fill="#1b6fc9"/>

            <path d="M10 18 h3 M10 23 h3 M10 28 h3 M15 18 h2 M15 23 h2 M15 28 h2" stroke="#fff" stroke-width="1.6"/>

          </svg>
        </div>
        <div class="lbl">企業資料</div>
      </div>
      <div class="qa">
        <div class="ic">

            <path d="M8 14 L21 8 L34 14 V30 L21 36 L8 30 Z" fill="#2fb9c9"/>
            <path d="M8 14 L21 20 L34 14 M21 20 V36" stroke="#1b6fc9" stroke-width="1.8" fill="none" stroke-linejoin="round"/>

          </svg>
        </div>
        <div class="lbl">文件包</div>

      <div class="qa">
        <div class="ic">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <path d="M12 7 h18 M12 35 h18" stroke="#1b6fc9" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M14 7 c0 8 5 10 7 12 c-2 2 -7 4 -7 12 M28 7 c0 8 -5 10 -7 12 c2 2 7 4 7 12" stroke="#2fb9c9" stroke-width="2.2" fill="none"/>

      <div class="qa">
        <div class="ic">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <rect x="10" y="18" width="22" height="16" rx="3" fill="#1b6fc9"/>
            <path d="M15 18 v-4 a6 6 0 0 1 11.8 -1.5" stroke="#2fb9c9" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <circle cx="21" cy="25" r="2.4" fill="#fff"/>
            <path d="M21 26.5 v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="lbl">授權管理</div>
      </div>
      <div class="qa">
        <div class="ic">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <circle cx="21" cy="9" r="4" fill="#1b6fc9"/>
            <circle cx="10" cy="30" r="4" fill="#2fb9c9"/>
            <circle cx="32" cy="30" r="4" fill="#2fb9c9"/>
            <path d="M21 13 v6 M21 19 L12 26 M21 19 L30 26" stroke="#1b6fc9" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="lbl">委託管理</div>
      </div>
    </div>

    <!-- Guide tabs -->
    <div class="guide-head">
      <button class="guide-tab active" onclick="switchTab('beginner', this)">新手攻略</button>
      <button class="guide-tab" onclick="switchTab('sme', this)">中小企指南</button>
      <span class="guide-more">更多</span>
    </div>

    <!-- Beginner -->
    <div class="tab-panel active" id="panel-beginner">
      <div class="cards">
        <div class="card tall bg-mint">
          <div class="c-title">貿易單一窗口</div>
          <div class="c-sub">商務及經濟發展局</div>
          <span class="c-ic">
            <svg width="52" height="42" viewBox="0 0 52 42" fill="none">
              <path d="M4 22 h10 v-6 a3.5 3.5 0 0 1 7 0 v6 h10 v10 h-10 v6 a3.5 3.5 0 0 1 -7 0 v-6 H4 Z" fill="#7fc8bc"/>
              <path d="M34 4 h10 v10 h-10 v6 a3.5 3.5 0 0 1 -7 0 v-6 h-3 V4 Z" fill="#a5dcd3" transform="translate(3 14)"/>
            </svg>
          </span>
        </div>
        <div class="card bg-yellow">
          <div class="c-title">準備貿易文件</div>
          <span class="c-ic">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
              <rect x="7" y="4" width="20" height="26" rx="2" fill="#f0d76a"/>
              <path d="M11 10 h12 M11 15 h12 M11 20 h8" stroke="#c9a92e" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M23 30 l3 3 5 -6" stroke="#c9a92e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <div class="card bg-pink">
          <div class="c-title">本地配送與電商物流</div>
          <span class="c-ic">
            <svg width="36" height="34" viewBox="0 0 36 34" fill="none">
              <path d="M4 6 h4 l3.5 14 h16 l3 -10 H10" stroke="#d47ba0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="14" cy="27" r="2.8" fill="#d47ba0"/>
              <circle cx="25" cy="27" r="2.8" fill="#d47ba0"/>
            </svg>
          </span>
        </div>
        <div class="card bg-peri">
          <div class="c-title">制定營銷策略</div>
          <span class="c-ic">
            <svg width="36" height="34" viewBox="0 0 36 34" fill="none">
              <rect x="5" y="5" width="26" height="17" rx="2" fill="#a9b6e0"/>
              <path d="M10 17 l5 -5 4 3 6 -7" stroke="#5b6fc0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 22 v7 M22 22 v7 M11 29 h14" stroke="#5b6fc0" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
        <div class="card bg-blue">
          <div class="c-title">港口社區系統</div>
          <span class="c-ic">
            <svg width="38" height="34" viewBox="0 0 38 34" fill="none">
              <path d="M6 22 h26 l-3.5 7 h-19 Z" fill="#8faad4"/>
              <path d="M12 22 v-8 h14 v8" stroke="#5b7fb8" stroke-width="2" fill="none"/>
              <path d="M16 14 v-4 h6 v4" stroke="#5b7fb8" stroke-width="2" fill="none"/>
              <path d="M4 31 q3 2.5 6 0 q3 2.5 6 0 q3 2.5 6 0 q3 2.5 6 0 q3 2.5 6 0" stroke="#5b7fb8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            </svg>
          </span>

      </div>
    </div>

    <!-- SME -->
    <div class="tab-panel" id="panel-sme">
      <div class="cards">
        <div class="card tall bg-mint">
          <div class="c-title">貿易單一窗口</div>
          <div class="c-sub">商務及經濟發展局</div>
          <span class="c-ic">
            <svg width="52" height="42" viewBox="0 0 52 42" fill="none">
              <path d="M4 22 h10 v-6 a3.5 3.5 0 0 1 7 0 v6 h10 v10 h-10 v6 a3.5 3.5 0 0 1 -7 0 v-6 H4 Z" fill="#7fc8bc"/>
            </svg>
          </span>
        </div>
        <div class="card bg-yellow">
          <div class="c-title">準備貿易文件</div>
        </div>
        <div class="card bg-pink">
          <div class="c-title">本地配送與電商物流</div>
        </div>
        <div class="card bg-peri">
          <div class="c-title">制定營銷策略</div>
        </div>
        <div class="card bg-blue">
          <div class="c-title">港口社區系統</div>
        </div>
      </div>
    </div>

    <div style="height:14px"></div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg width="26" height="26" viewBox="0 0 28 28"><path d="M14 4.5 L24.5 13 a2 2 0 0 1 .7 1.5 V23 a1.5 1.5 0 0 1 -1.5 1.5 H4.8 A1.5 1.5 0 0 1 3.3 23 V14.5 a2 2 0 0 1 .7-1.5 Z" fill="currentColor"/><rect x="11.5" y="17" width="5" height="7.5" rx="1" fill="#fff"/></svg>
      <span class="nav-label">首頁</span>
    </div>
    <div class="nav-item">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none"><rect x="4" y="4" width="8.5" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="16" y="2.6" width="8.5" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.8" transform="rotate(15 20.2 6.8)"/><rect x="4" y="15.5" width="8.5" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="15.5" y="15.5" width="8.5" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
      <span class="nav-label">服務</span>
    </div>
    <div class="nav-item">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="17" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="17" width="7" height="7" rx="1.2"/><rect x="17" y="17" width="3" height="3" rx=".5" fill="currentColor" stroke="none"/><rect x="21" y="21" width="3" height="3" rx=".5" fill="currentColor" stroke="none"/><rect x="17" y="21" width="3" height="3" rx=".5" fill="currentColor" stroke="none"/></svg>

      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="9" width="20" height="14" rx="2.5"/><path d="M10 9 V7 a2 2 0 0 1 2-2 h4 a2 2 0 0 1 2 2 v2"/><path d="M4 15 h20"/><circle cx="14" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
      <span class="nav-label">本企</span>
    </div>
  </div>

</div>

<script>
  function switchTab(name, btn) {
    document.querySelectorAll('.guide-tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    document.getElementById('panel-'+name).classList.add('active');
  }
</script>
</body>
</html>
