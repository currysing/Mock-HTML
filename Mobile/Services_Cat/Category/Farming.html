<script>(function(){
  function setHeartState(el, on) {
    el.classList.toggle('is-favorite', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
    el.setAttribute('aria-label', on ? 'Favorite' : 'Not favorite');
  }
  document.addEventListener('click', function (e) {
    var heart = e.target.closest && e.target.closest('.favorite-heart');
    if (!heart || heart.closest('.service-disabled')) return;
    e.preventDefault();
    e.stopPropagation();
    setHeartState(heart, !heart.classList.contains('is-favorite'));
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key !== 'Enter' && e.key !== ' ') || !e.target.classList || !e.target.classList.contains('favorite-heart')) return;
    e.preventDefault();
    setHeartState(e.target, !e.target.classList.contains('is-favorite'));
  });
})();</script><script>(function(){
  function applyServiceFilters() {
    var authorisedOnly = !!(document.getElementById('filter-authorised') || {}).checked;
    var favoriteOnly = !!(document.getElementById('filter-favorite') || {}).checked;
    document.querySelectorAll('.service-item').forEach(function (item) {
      var isAuthorised = !item.classList.contains('service-disabled');
      var isFavorite = !!item.querySelector('.favorite-heart.is-favorite');
      item.style.display = ((authorisedOnly && !isAuthorised) || (favoriteOnly && !isFavorite)) ? 'none' : '';
    });
  }
  var authorised = document.getElementById('filter-authorised');
  var favorite = document.getElementById('filter-favorite');
  if (authorised) authorised.addEventListener('change', applyServiceFilters);
  if (favorite) favorite.addEventListener('change', applyServiceFilters);
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.favorite-heart')) setTimeout(applyServiceFilters, 0);
  });
  applyServiceFilters();
})();</script></body>
