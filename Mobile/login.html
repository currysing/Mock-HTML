<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>身份驗證方法</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e0e0e0;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 20px 0;
    font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', sans-serif;
  }
  .phone-frame {
    width: 393px; height: 852px;
    background: white;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    border-radius: 48px;
  }

  /* Status Bar */
  .status-bar {
    height: 50px; background: #155CB0; display: flex; align-items: flex-end;
    justify-content: space-between; padding: 0 26px 6px; flex-shrink: 0;
  }
  .sb-time { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .3px; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .batt { display: inline-flex; align-items: center; gap: 2px; }
  .batt-body {
    border: 1px solid rgba(255,255,255,.65); border-radius: 4px;
    font-size: 9px; font-weight: 700; padding: 1px 3px; line-height: 1;
    min-width: 22px; text-align: center;
    background: linear-gradient(to right, rgba(255,255,255,.9) 79%, transparent 79%);
    -webkit-text-fill-color: #155CB0;
  }
  .batt-tip { width: 2px; height: 5px; background: rgba(255,255,255,.65); border-radius: 0 2px 2px 0; }

  /* Header */
  .header {
    height: 50px; background: #155CB0;
    display: flex; align-items: center;
    padding: 0 14px; position: relative;
    flex-shrink: 0;
  }
  .header-back { background: none; border: none; cursor: pointer; padding: 4px; display: flex; }
  .header-title {
    color: #fff; font-size: 18px; font-weight: 600;
    position: absolute; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .header-right .divider { width: 1px; height: 20px; background: rgba(255,255,255,.4); }
  .header-btn { background: none; border: none; cursor: pointer; padding: 2px; display: flex; }

  /* Content */
  .content-area {
    flex: 1; overflow-y: auto; background: #eef1f4;
  }
  .content-area::-webkit-scrollbar { display: none; }

  .page-heading {
    font-size: 26px; font-weight: 800; color: #1a1a1a;
    padding: 22px 18px 16px;
  }

  .auth-section {
    background: #fff; border-radius: 14px;
    margin: 0 14px 16px; padding: 20px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }

  .section-heading {
    font-size: 20px; font-weight: 700; color: #155CB0;
    margin-bottom: 12px;
  }

  .section-desc {
    font-size: 15px; color: #333; line-height: 1.65;
    margin-bottom: 18px;
  }

  .auth-btn {
    width: 100%; border: none; border-radius: 30px;
    padding: 15px 16px; font-size: 17px;
    font-family: inherit; font-weight: 600;
    cursor: pointer; color: white; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .auth-btn svg { display: block; }
  .btn-green { background: #3d7d68; }
  .btn-blue  { background: #155CB0; }

  .ext-link {
    display: flex; align-items: center; gap: 7px;
    color: #157a8c; font-size: 15px;
    text-decoration: none; cursor: pointer;
    margin-bottom: 14px;
  }
  .ext-link:last-child { margin-bottom: 0; }
  .ext-link .link-icon { display: flex; }
</style>
</head>
<body>
<div class="phone-frame">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="sb-time">11:18</span>
    <div class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M2.5 5.2a9 9 0 0 1 12 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M5 7.6a5.2 5.2 0 0 1 7 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="10" r="1.3" fill="#fff"/></svg>
      <span class="batt"><span class="batt-body">79</span><span class="batt-tip"></span></span>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <button class="header-back"><svg width="11" height="20" viewBox="0 0 11 20" fill="none"><path d="M9 2 L2 10 L9 18" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="header-title">身份驗證方法</span>
    <div class="header-right">
      <button class="header-btn"><svg width="22" height="6" viewBox="0 0 22 6"><circle cx="3" cy="3" r="2.5" fill="#fff"/><circle cx="11" cy="3" r="2.5" fill="#fff"/><circle cx="19" cy="3" r="2.5" fill="#fff"/></svg></button>
      <span class="divider"></span>
      <button class="header-btn"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 3 L15 15 M15 3 L3 15" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <!-- Content -->
  <div class="content-area">

    <div class="page-heading">身份驗證方法</div>

    <!-- Section 1: HK ID holders -->
    <div class="auth-section">
      <div class="section-heading">香港身份證持有人</div>
      <div class="section-desc">
        如果你是持有香港身份證的香港公民，請使用智方便登入。
      </div>
      <button class="auth-btn btn-green">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="6" y="2.5" width="12" height="19" rx="2.5" stroke="#fff" stroke-width="1.6"/><path d="M9.5 6.5l1.2 1.2 2.6-2.6" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="18.5" r="1" fill="#fff"/></svg>
        使用智方便登入 CorpID
      </button>
      <a class="ext-link" href="#">
        <span>還沒有智方便？現在申請</span>
        <span class="link-icon"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="2.5" stroke="#157a8c" stroke-width="1.3"/><path d="M6 10 L10 6 M10 6 H7 M10 6 V9" stroke="#157a8c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <a class="ext-link" href="#">
        <span>了解更多關於智方便的資訊</span>
        <span class="link-icon"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="2.5" stroke="#157a8c" stroke-width="1.3"/><path d="M6 10 L10 6 M10 6 H7 M10 6 V9" stroke="#157a8c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </div>

    <!-- Section 2: Non-HK ID holders -->
    <div class="auth-section">
      <div class="section-heading">非香港身份證持有人</div>
      <div class="section-desc">
        如果你是沒有香港身份證的外國人，你也可以選擇使用 iD–One 進行身份驗證。
      </div>
      <button class="auth-btn btn-blue">使用 iD–One 登入 CorpID</button>
      <a class="ext-link" href="#">
        <span>了解 iD-One 更多資訊</span>
        <span class="link-icon"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="2.5" stroke="#157a8c" stroke-width="1.3"/><path d="M6 10 L10 6 M10 6 H7 M10 6 V9" stroke="#157a8c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </div>

  </div>

</div>
</body>
</html>
