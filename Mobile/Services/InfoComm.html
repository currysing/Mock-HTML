<!DOCTYPE html>

<head>

<title>InfoComm — 資訊及通訊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e0e0e0;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 20px 0;
    font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  .phone-frame {
    width: 393px; height: 852px;
    background: #fff;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    border-radius: 48px;
  }

  /* ---- Status Bar ---- */
  .status-bar {
    height: 50px; background: #1C6FD6; display: flex; align-items: flex-end;
    justify-content: space-between; padding: 0 26px 6px; flex-shrink: 0;
  }
  .sb-time { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .3px; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .batt { display: inline-flex; align-items: center; gap: 2px; }
  .batt-body {
    border: 1px solid rgba(255,255,255,.65); border-radius: 4px;
    font-size: 9px; font-weight: 700; padding: 1px 3px; line-height: 1;
    min-width: 22px; text-align: center;
    background: linear-gradient(to right, rgba(255,255,255,.9) 79%, transparent 79%);
    -webkit-text-fill-color: #1C6FD6;
  }
  .batt-tip { width: 2px; height: 5px; background: rgba(255,255,255,.65); border-radius: 0 2px 2px 0; }

  /* ---- Header ---- */
  .header {
    height: 50px; background: #1C6FD6; display: flex; align-items: center;
    padding: 0 14px; position: relative; flex-shrink: 0;
  }
  .header-back { background: none; border: none; cursor: pointer; padding: 4px; display: flex; }
  .header-title {
    color: #fff; font-size: 18px; font-weight: 600;
    position: absolute; left: 50%; transform: translateX(-50%);
  }
  .capsule {
    margin-left: auto; display: flex; align-items: center; gap: 0;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35);
    border-radius: 16px; height: 32px; padding: 0 4px;
  }
  .capsule-btn { background: none; border: none; cursor: pointer; padding: 0 9px; display: flex; align-items: center; }
  .capsule .divider { width: 1px; height: 18px; background: rgba(255,255,255,.45); }

  /* ---- Topic banner ---- */
  .org-banner {
    background: #e9f0f8; display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; flex-shrink: 0;
  }
  .org-banner .logo { width: 46px; height: 46px; flex-shrink: 0; }
  .org-banner .name { font-size: 17px; font-weight: 700; color: #1a1a1a; }

  /* ---- Content ---- */
  .list-area { flex: 1; overflow-y: auto; background: #fff; }
  .list-area::-webkit-scrollbar { display: none; }
  .section-title {
    padding: 16px 16px 6px; font-size: 13px; font-weight: 600;
    color: #7c8590; letter-spacing: .3px;
  }
  .org-list { padding: 0 16px; }
  .org-item {
    display: flex; align-items: center; padding: 15px 0;
    border-bottom: 1px solid #eef0f2; cursor: pointer;
    color: inherit; text-decoration: none;
  }
  .org-item:active { background: #f6f8fa; }
  .org-logo {
    width: 46px; height: 46px; flex-shrink: 0; margin-right: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .org-name { flex: 1; font-size: 16px; color: #1a1a1a; line-height: 1.35; }
  .org-arrow { color: #b9c1ca; display: flex; flex-shrink: 0; }

  /* ---- Bottom Nav ---- */
  .bottom-nav {
    height: 78px; background: #fff; border-top: 1px solid #e7e9ec;
    display: flex; align-items: flex-start; flex-shrink: 0; padding-top: 8px;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; color: #5b6168;
  }
  .nav-item.active { color: #155CB0; }
  .nav-item svg { display: block; }
  .nav-label { font-size: 11px; font-weight: 500; color: inherit; }
</style>
</head>
