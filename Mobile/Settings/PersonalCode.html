<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>個人碼 — CorpID</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e0e0e0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 0; font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  .phone-frame { width: 393px; height: 852px; background: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.25); border-radius: 48px; }
  .status-bar { height: 50px; background: #fff; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 6px; flex-shrink: 0; }
  .sb-time { font-size: 15px; font-weight: 600; color: #1a1a1a; letter-spacing: .3px; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .batt { display: inline-flex; align-items: center; gap: 2px; }
  .batt-body { border: 1px solid rgba(0,0,0,.55); border-radius: 4px; font-size: 9px; font-weight: 700; padding: 1px 3px; line-height: 1; min-width: 22px; text-align: center; background: linear-gradient(to right, rgba(0,0,0,.8) 79%, transparent 79%); -webkit-text-fill-color: #fff; }
  .batt-tip { width: 2px; height: 5px; background: rgba(0,0,0,.55); border-radius: 0 2px 2px 0; }
  .header { height: 50px; background: #fff; display: flex; align-items: center; padding: 0 14px; position: relative; flex-shrink: 0; border-bottom: 1px solid #eef0f2; }
  .header-back { background: none; border: none; cursor: pointer; padding: 4px; display: flex; }
  .header-title { color: #1a1a1a; font-size: 18px; font-weight: 700; position: absolute; left: 50%; transform: translateX(-50%); }
  .body-scroll { flex: 1; overflow-y: auto; background: #fff; }
  .body-scroll::-webkit-scrollbar { display: none; }
  .banner { background: #e9f0f8; padding: 18px 18px; }
  .banner h2 { font-size: 20px; font-weight: 800; color: #155CB0; margin-bottom: 6px; }
  .banner p { font-size: 15px; color: #4a7bb5; }
  .opt { display: flex; align-items: center; padding: 20px 18px; border-bottom: 1px solid #eef0f2; cursor: pointer; }
  .opt:active { background: #f6f8fa; }
  .opt .lbl { flex: 1; font-size: 16px; color: #1a1a1a; }
  .opt .check { display: none; }
  .opt.sel .check { display: flex; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="sb-time">12:34</span>
    <div class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#1a1a1a"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#1a1a1a"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#1a1a1a"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#1a1a1a"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M2.5 5.2a9 9 0 0 1 12 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><path d="M5 7.6a5.2 5.2 0 0 1 7 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="10" r="1.3" fill="#1a1a1a"/></svg>
      <span class="batt"><span class="batt-body">79</span><span class="batt-tip"></span></span>
    </div>
  </div>
  <div class="header">
    <a class="header-back" href="INDEX.html"><svg width="11" height="20" viewBox="0 0 11 20" fill="none"><path d="M9 2 L2 10 L9 18" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="header-title">個人碼</span>
  </div>

  <div class="body-scroll">
    <div class="banner">
      <h2>掃描有效期</h2>
      <p>僅接受以下期限內產生的個人碼</p>
    </div>
    <div class="opt sel"><span class="lbl">5分鐘</span><span class="check"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M2 8 L8 14 L20 2" stroke="#155CB0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="opt"><span class="lbl">4分鐘</span><span class="check"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M2 8 L8 14 L20 2" stroke="#155CB0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="opt"><span class="lbl">3分鐘</span><span class="check"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M2 8 L8 14 L20 2" stroke="#155CB0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="opt"><span class="lbl">2分鐘</span><span class="check"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M2 8 L8 14 L20 2" stroke="#155CB0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="opt"><span class="lbl">1分鐘</span><span class="check"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M2 8 L8 14 L20 2" stroke="#155CB0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
</div>
<script>
  (function () {
    var opts = document.querySelectorAll('.opt');
    opts.forEach(function (o) {
      o.addEventListener('click', function () {
        opts.forEach(function (x) { x.classList.remove('sel'); });
        o.classList.add('sel');
      });
    });
  })();
</script>
</body>
</html>
