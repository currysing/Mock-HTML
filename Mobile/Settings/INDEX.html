<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>設定 — CorpID</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e0e0e0;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 20px 0;
    font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  .phone-frame {
    width: 393px; height: 852px;
    background: #fff;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    border-radius: 48px;
  }

  /* ---- Status Bar ---- */
  .status-bar {
    height: 50px; background: #155CB0; display: flex; align-items: flex-end;
    justify-content: space-between; padding: 0 26px 6px; flex-shrink: 0;
  }
  .sb-time { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .3px; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .batt { display: inline-flex; align-items: center; gap: 2px; }
  .batt-body {
    border: 1px solid rgba(255,255,255,.65); border-radius: 4px;
    font-size: 9px; font-weight: 700; padding: 1px 3px; line-height: 1;
    min-width: 22px; text-align: center;
    background: linear-gradient(to right, rgba(255,255,255,.9) 79%, transparent 79%);
    -webkit-text-fill-color: #155CB0;
  }
  .batt-tip { width: 2px; height: 5px; background: rgba(255,255,255,.65); border-radius: 0 2px 2px 0; }

  /* ---- Profile header ---- */
  .pro-header {
    height: 56px; background: #155CB0; display: flex; align-items: center;
    padding: 0 18px; flex-shrink: 0;
  }
  .pro-logo { display: flex; align-items: center; }
  .pro-name { color: #fff; font-size: 19px; font-weight: 700; margin-left: 12px; }
  .pro-eye { margin-left: 9px; display: flex; }
  .pro-logout { margin-left: auto; background: none; border: none; cursor: pointer; display: flex; padding: 4px; }

  /* ---- Content ---- */
  .list-area { flex: 1; overflow-y: auto; background: #fff; }
  .list-area::-webkit-scrollbar { display: none; }
  .section-title {
    padding: 16px 16px 8px; font-size: 14px; font-weight: 700;
    color: #1a1a1a; background: #f4f6f8;
  }
  .set-list { padding: 0 16px; }
  .set-item {
    display: flex; align-items: center; padding: 16px 0;
    border-bottom: 1px solid #eef0f2; cursor: pointer;
    color: inherit; text-decoration: none;
  }
  .set-item:active { background: #f6f8fa; }
  .set-icon {
    width: 30px; flex-shrink: 0; margin-right: 16px;
    display: flex; align-items: center; justify-content: center;
    color: #155CB0;
  }
  .set-name { flex: 1; font-size: 16px; color: #1a1a1a; }
  .set-arrow { color: #c4ccd4; display: flex; flex-shrink: 0; }
  .set-value { font-size: 15px; color: #155CB0; font-weight: 600; }

  /* ---- Toggle ---- */
  .toggle {
    width: 50px; height: 30px; border-radius: 15px; background: #c8ced4;
    position: relative; flex-shrink: 0; cursor: pointer; transition: background .2s;
  }
  .toggle .knob {
    position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: left .2s;
  }
  .toggle.on { background: #155CB0; }
  .toggle.on .knob { left: 23px; }

  /* ---- Bottom Nav ---- */
  .bottom-nav {
    height: 78px; background: #fff; border-top: 1px solid #e7e9ec;
    display: flex; align-items: flex-start; flex-shrink: 0; padding-top: 8px;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; color: #5b6168; text-decoration: none;
  }
  .nav-item.active { color: #155CB0; }
  .nav-item svg { display: block; }
  .nav-label { font-size: 11px; font-weight: 500; color: inherit; }
</style>
</head>
