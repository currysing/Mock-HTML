<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>常見問題 — CorpID</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e0e0e0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 0; font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  .phone-frame { width: 393px; height: 852px; background: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.25); border-radius: 48px; }
  .status-bar { height: 50px; background: #fff; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 6px; flex-shrink: 0; }
  .sb-time { font-size: 15px; font-weight: 600; color: #1a1a1a; letter-spacing: .3px; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .batt { display: inline-flex; align-items: center; gap: 2px; }
  .batt-body { border: 1px solid rgba(0,0,0,.55); border-radius: 4px; font-size: 9px; font-weight: 700; padding: 1px 3px; line-height: 1; min-width: 22px; text-align: center; background: linear-gradient(to right, rgba(0,0,0,.8) 79%, transparent 79%); -webkit-text-fill-color: #fff; }
  .batt-tip { width: 2px; height: 5px; background: rgba(0,0,0,.55); border-radius: 0 2px 2px 0; }
  .header { height: 50px; background: #fff; display: flex; align-items: center; padding: 0 14px; position: relative; flex-shrink: 0; border-bottom: 1px solid #eef0f2; }
  .header-back { background: none; border: none; cursor: pointer; padding: 4px; display: flex; }
  .header-title { color: #1a1a1a; font-size: 18px; font-weight: 700; position: absolute; left: 50%; transform: translateX(-50%); }
  .body-scroll { flex: 1; overflow-y: auto; background: #fff; }
  .body-scroll::-webkit-scrollbar { display: none; }
  .category { padding: 18px 18px 6px; font-size: 15px; color: #0f8b8d; font-weight: 600; }
  .question { padding: 0 18px 14px; font-size: 18px; font-weight: 700; color: #1a1a1a; line-height: 1.4; }
  .divider { height: 1px; background: #eef0f2; margin: 0 18px; }
  .answer { padding: 18px; font-size: 16px; color: #555; line-height: 1.7; }
  .answer p { margin-bottom: 16px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer a { color: #155CB0; text-decoration: underline; }
  .cta-section { padding: 0 18px 18px; }
  .cta-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 14px; }
  .cta-title::before { content: ''; display: block; width: 10px; height: 10px; background: #1a1a1a; }
  .cta-card { display: flex; align-items: center; gap: 14px; border: 2px solid #0f8b8d; border-radius: 14px; padding: 16px 18px; cursor: pointer; }
  .cta-card:active { background: #f0f8f7; }
  .cta-icon { flex-shrink: 0; color: #0f8b8d; }
  .cta-icon svg { display: block; }
  .cta-text { flex: 1; }
  .cta-text .main { font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .cta-text .sub { font-size: 14px; color: #555; margin-top: 4px; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="sb-time">12:34</span>
    <div class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#1a1a1a"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#1a1a1a"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#1a1a1a"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#1a1a1a"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M2.5 5.2a9 9 0 0 1 12 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><path d="M5 7.6a5.2 5.2 0 0 1 7 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="10" r="1.3" fill="#1a1a1a"/></svg>
      <span class="batt"><span class="batt-body">79</span><span class="batt-tip"></span></span>
    </div>
  </div>
  <div class="header">
    <a class="header-back" href="Help.html"><svg width="11" height="20" viewBox="0 0 11 20" fill="none"><path d="M9 2 L2 10 L9 18" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="header-title">常見問題</span>
  </div>
  <div class="body-scroll">
    <div class="category">如何使用</div>
    <div class="question">「CorpID」流動應用程式支援哪些生物認證功能？</div>
    <div class="divider"></div>
    <div class="answer">
      <p>「CorpID」支援流動電話內所提供的指紋或臉容辨識功能。</p>
    </div>
    <div class="cta-section">
      <div class="cta-title">還找不到所需資料和方法？</div>
      <div class="cta-card">
        <span class="cta-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect x="4" y="16" width="28" height="20" rx="4" stroke="#0f8b8d" stroke-width="2"/>
            <path d="M10 24 H26" stroke="#0f8b8d" stroke-width="2" stroke-linecap="round"/>
            <path d="M10 28 H22" stroke="#0f8b8d" stroke-width="2" stroke-linecap="round"/>
            <circle cx="28" cy="12" r="8" stroke="#0f8b8d" stroke-width="2"/>
            <path d="M28 8 V12 L30 14" stroke="#0f8b8d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="cta-text">
          <span class="main">即時對話</span>
          <span class="sub">與我們的服務人員即時對話</span>
        </span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
