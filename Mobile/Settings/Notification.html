<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>通知 — CorpID</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e0e0e0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 0; font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  .phone-frame { width: 393px; height: 852px; background: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.25); border-radius: 48px; }
  .status-bar { height: 50px; background: #fff; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 6px; flex-shrink: 0; }
  .sb-time { font-size: 15px; font-weight: 600; color: #1a1a1a; letter-spacing: .3px; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .batt { display: inline-flex; align-items: center; gap: 2px; }
  .batt-body { border: 1px solid rgba(0,0,0,.55); border-radius: 4px; font-size: 9px; font-weight: 700; padding: 1px 3px; line-height: 1; min-width: 22px; text-align: center; background: linear-gradient(to right, rgba(0,0,0,.8) 79%, transparent 79%); -webkit-text-fill-color: #fff; }
  .batt-tip { width: 2px; height: 5px; background: rgba(0,0,0,.55); border-radius: 0 2px 2px 0; }
  .header { height: 50px; background: #fff; display: flex; align-items: center; padding: 0 14px; position: relative; flex-shrink: 0; border-bottom: 1px solid #eef0f2; }
  .header-back { background: none; border: none; cursor: pointer; padding: 4px; display: flex; }
  .header-title { color: #1a1a1a; font-size: 18px; font-weight: 700; position: absolute; left: 50%; transform: translateX(-50%); }
  .body-scroll { flex: 1; overflow-y: auto; background: #fff; }
  .body-scroll::-webkit-scrollbar { display: none; }
  .section-title { padding: 14px 18px; font-size: 15px; font-weight: 700; color: #1a1a1a; background: #f4f6f8; }
  .section-title.with-action { display: flex; align-items: center; gap: 12px; }
  .section-title .section-label { flex: 1; min-width: 0; }
  .category-title { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #eef0f2; color: #155CB0; background: #f9fafb; cursor: pointer; }
  .category-title:active { background: #eef4fb; }
  .category-label { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.35; white-space: pre-line; overflow-wrap: anywhere; }
  .category-icon { width: 10px; height: 10px; border-right: 2px solid #155CB0; border-bottom: 2px solid #155CB0; transform: rotate(45deg); transition: transform .2s; flex-shrink: 0; }
  .category-title.collapsed .category-icon { transform: rotate(-45deg); }
  .category-items.collapsed { display: none; }
  .toggle-all { flex-shrink: 0; min-width: 72px; padding: 6px 10px; border: 1px solid #155CB0; border-radius: 8px; background: #fff; color: #155CB0; font-size: 13px; font-weight: 700; cursor: pointer; }
  .toggle-all:active { background: #eef4fb; }
  .noti-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px 14px 44px; border-bottom: 1px solid #eef0f2; color: inherit; cursor: pointer; }
  .noti-row:active { background: #f6f8fa; }
  .noti-row .lbl { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; color: #1a1a1a; white-space: pre-line; overflow-wrap: anywhere; }
  .item-checkbox { width: 20px; height: 20px; margin-top: 0; accent-color: #155CB0; flex-shrink: 0; }
  .switch { position: relative; display: inline-flex; flex-shrink: 0; width: 50px; height: 30px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch-track { width: 50px; height: 30px; border-radius: 15px; background: #c8ced4; position: relative; transition: background .2s; }
  .switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .2s; }
  .switch input:checked + .switch-track { background: #155CB0; }
  .switch input:checked + .switch-track::after { left: 23px; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="sb-time">12:34</span>
    <div class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#1a1a1a"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#1a1a1a"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#1a1a1a"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#1a1a1a"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M2.5 5.2a9 9 0 0 1 12 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><path d="M5 7.6a5.2 5.2 0 0 1 7 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="10" r="1.3" fill="#1a1a1a"/></svg>
      <span class="batt"><span class="batt-body">79</span><span class="batt-tip"></span></span>
    </div>
  </div>
  <div class="header">
    <a class="header-back" href="INDEX.html"><svg width="11" height="20" viewBox="0 0 11 20" fill="none"><path d="M9 2 L2 10 L9 18" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="header-title">通知</span>
  </div>

  <div class="body-scroll">
    <div class="section-title with-action"><span class="section-label">通知設定</span><button class="toggle-all" id="toggleAllNotifications" type="button"></button></div>
    <div id="notificationList"></div>
  </div>
</div>
<script>
  const notificationCategories = JSON.parse(atob('W3siY2F0ZWdvcnkiOiJQZXJzb25hbCBBY2NvdW50IiwiaXRlbXMiOlsiUGFzc3dvcmQgQ2hhbmdlZCIsIk1vYmlsZSBDaGFuZ2VkIiwiRW1haWwgQ2hhbmdlZCIsIkRldmljZSBCb3VuZCIsIkRldmljZSBVbmJvdW5kIl19LHsiY2F0ZWdvcnkiOiJDb21wYW55IE1lbWJlcnNoaXAiLCJpdGVtcyI6WyJVc2VyIEludml0ZWQiLCJVc2VyIEpvaW5lZCIsIlVzZXIgUmVtb3ZlZCIsIkFkbWluIEFwcG9pbnRlZCIsIkFkbWluIFJlbW92ZWQiLCJSUCBBcHBvaW50ZWQiLCJSUCBSZW1vdmVkIiwiQVIgQXBwb2ludGVkIiwiQVIgUmVtb3ZlZCJdfSx7ImNhdGVnb3J5IjoiQXV0aG9yaXNhdGlvbiAvIERlbGVnYXRpb24iLCJpdGVtcyI6WyJBdXRob3Jpc2F0aW9uIEdyYW50ZWQiLCJBdXRob3Jpc2F0aW9uIFJldm9rZWQiLCJEZWxlZ2F0aW9uIENyZWF0ZWQiLCJEZWxlZ2F0aW9uIEV4cGlyZWQiXX0seyJjYXRlZ29yeSI6IkNlcnRpZmljYXRlIExpZmVjeWNsZSIsIml0ZW1zIjpbIkNlcnRpZmljYXRlIEFwcGxpY2F0aW9uIiwiQ2VydGlmaWNhdGUgQXBwcm92YWwiLCJDZXJ0aWZpY2F0ZSBJc3N1ZWQiLCJDZXJ0aWZpY2F0ZSBFeHBpcnkiLCJDZXJ0aWZpY2F0ZSBSZXZva2VkIiwiQ2VydGlmaWNhdGUgUmVuZXdlZCJdfSx7ImNhdGVnb3J5IjoiUmVnaXN0cmF0aW9uIExpZmVjeWNsZSIsIml0ZW1zIjpbIkNvcnBJRCBSZWdpc3RyYXRpb24gU3VibWl0dGVkIiwiUmVnaXN0cmF0aW9uIEFwcHJvdmVkIiwiUmVnaXN0cmF0aW9uIFJlamVjdGVkIiwiUmVnaXN0cmF0aW9uIFN1c3BlbmRlZCJdfSx7ImNhdGVnb3J5IjoiU2VjdXJpdHkgRXZlbnRzIiwiaXRlbXMiOlsiU3VzcGljaW91cyBMb2dpbiIsIkFjY291bnQgTG9ja2VkIiwiQWNjb3VudCBTdXNwZW5kZWQiXX0seyJjYXRlZ29yeSI6IkFwcGxpY2F0aW9uIFdvcmtmbG93IiwiaXRlbXMiOlsiQXBwbGljYXRpb24gU3VibWl0dGVkIiwiQXBwcm92YWwgUGVuZGluZyIsIkFwcHJvdmFsIENvbXBsZXRlZCIsIlJlcXVlc3QgUmVqZWN0ZWQiXX0seyJjYXRlZ29yeSI6IkJvYXJkY2FzdCBBbm5vdW5jZW1lbnQiLCJpdGVtcyI6WyJTY2hlZHVsZWQgU3lzdGVtIE1haW50ZW5hbmNlIE5vdGljZSJdfV0='));

  (function () {
    const list = document.getElementById('notificationList');
    const toggleAll = document.getElementById('toggleAllNotifications');
    const groups = [];

    notificationCategories.forEach(function (group, groupIndex) {
      const title = document.createElement('div');
      title.className = 'category-title collapsed';
      title.setAttribute('role', 'button');
      title.setAttribute('tabindex', '0');
      title.setAttribute('aria-expanded', 'false');
      title.setAttribute('aria-controls', 'category-items-' + groupIndex);

      const categoryToggle = document.createElement('label');
      categoryToggle.className = 'switch';

      const categoryCheckbox = document.createElement('input');
      categoryCheckbox.type = 'checkbox';
      categoryCheckbox.checked = true;
      categoryCheckbox.id = 'noti-category-' + groupIndex;
      categoryCheckbox.setAttribute('aria-label', group.category);

      const categoryTrack = document.createElement('span');
      categoryTrack.className = 'switch-track';

      categoryToggle.appendChild(categoryCheckbox);
      categoryToggle.appendChild(categoryTrack);

      const label = document.createElement('span');
      label.className = 'category-label';
      label.textContent = group.category;

      const icon = document.createElement('span');
      icon.className = 'category-icon';
      icon.setAttribute('aria-hidden', 'true');

      title.appendChild(categoryToggle);
      title.appendChild(label);
      title.appendChild(icon);
      list.appendChild(title);

      const items = document.createElement('div');
      items.className = 'category-items collapsed';
      items.id = 'category-items-' + groupIndex;
      list.appendChild(items);
      const childCheckboxes = [];
      groups.push({ title: title, items: items });

      function setCategoryChecked(checked) {
        categoryCheckbox.indeterminate = false;
        categoryCheckbox.checked = checked;
        childCheckboxes.forEach(function (checkbox) {
          checkbox.checked = checked;
        });
      }

      function updateCategoryCheckedFromChildren() {
        const checkedCount = childCheckboxes.filter(function (checkbox) {
          return checkbox.checked;
        }).length;
        categoryCheckbox.checked = checkedCount > 0;
        categoryCheckbox.indeterminate = false;
      }

      title.addEventListener('click', function () {
        const collapsed = items.classList.toggle('collapsed');
        title.classList.toggle('collapsed', collapsed);
        title.setAttribute('aria-expanded', String(!collapsed));
        updateToggleAllLabel();
      });

      title.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          title.click();
        }
      });

      categoryToggle.addEventListener('click', function (event) {
        event.stopPropagation();
      });

      categoryCheckbox.addEventListener('change', function () {
        setCategoryChecked(categoryCheckbox.checked);
      });

      group.items.forEach(function (item, itemIndex) {
        const row = document.createElement('label');
        row.className = 'noti-row';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'item-checkbox';
        checkbox.checked = true;
        checkbox.id = 'noti-' + groupIndex + '-' + itemIndex;
        checkbox.setAttribute('aria-label', item);
        childCheckboxes.push(checkbox);

        const itemLabel = document.createElement('span');
        itemLabel.className = 'lbl';
        itemLabel.textContent = item;

        row.appendChild(checkbox);
        row.appendChild(itemLabel);
        items.appendChild(row);

        checkbox.addEventListener('change', updateCategoryCheckedFromChildren);
      });
    });

    function setAllCollapsed(collapsed) {
      groups.forEach(function (group) {
        group.items.classList.toggle('collapsed', collapsed);
        group.title.classList.toggle('collapsed', collapsed);
        group.title.setAttribute('aria-expanded', String(!collapsed));
      });
      updateToggleAllLabel();
    }

    function updateToggleAllLabel() {
      const allCollapsed = groups.every(function (group) {
        return group.items.classList.contains('collapsed');
      });
      toggleAll.textContent = allCollapsed ? '展開全部' : '隱藏全部';
    }

    toggleAll.addEventListener('click', function () {
      const allCollapsed = groups.every(function (group) {
        return group.items.classList.contains('collapsed');
      });
      setAllCollapsed(!allCollapsed);
    });

    updateToggleAllLabel();
  })();
</script>
</body>
</html>
